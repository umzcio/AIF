services:
  app:
    build: .
    container_name: aif-app
    ports: ["3300:3000"]
    env_file: backend/.env
    environment:
      - DATABASE_URL=postgresql://aif:${DB_PASSWORD}@db:5432/aif
      - BASE_PATH=/aif
      - OUTPUT_DIR=/data/output
      - CODEBASES_DIR=/data/codebases
      - HECVAT_TEMPLATE_PATH=/app/hecvat415.xlsx
      - AUTH_PROVIDER=${AUTH_PROVIDER:-bypass}
      - AUTH_BYPASS=${AUTH_BYPASS:-false}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_NETIDS=${ADMIN_NETIDS:-}
      - CAS_BASE_URL=${CAS_BASE_URL:-}
      - CAS_SERVICE_URL=${CAS_SERVICE_URL:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - INSTITUTION_NAME=${INSTITUTION_NAME:-}
      - INSTITUTION_DOMAIN=${INSTITUTION_DOMAIN:-}
    volumes:
      - aif_output:/data/output
      - aif_codebases:/data/codebases
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/aif/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      db: { condition: service_healthy }
    networks: [aif-network]

  db:
    image: postgres:16-alpine
    container_name: aif-db
    volumes: [aif_pgdata:/var/lib/postgresql/data]
    environment:
      POSTGRES_DB: aif
      POSTGRES_USER: aif
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aif"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [aif-network]

volumes:
  aif_pgdata:
  aif_output:
  aif_codebases:

networks:
  aif-network:
    driver: bridge
